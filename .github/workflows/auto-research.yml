# Manual competitor briefing. NEVER add schedule: — daily runs flooded issues.
# Agents must not treat this as a merge gate that should run on every push.
name: Auto Research

on:
  workflow_dispatch: # Manual only — daily dumps were filling the issue tracker

permissions:
  contents: read
  issues: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - name: Run competitive research
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/auto-research.sh
