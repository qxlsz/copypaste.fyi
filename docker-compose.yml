services:
  copypaste:
    build: .
    user: "65532:65532"
    ports:
      - "8000:8000"
    volumes:
      - data:/data
    environment:
      COPYPASTE_AUTH_TOKEN: "${COPYPASTE_AUTH_TOKEN:-}"
      COPYPASTE_ADMIN_TOKEN: "${COPYPASTE_ADMIN_TOKEN:-}"
      COPYPASTE_BLOCKED_PASTE_IDS: "${COPYPASTE_BLOCKED_PASTE_IDS:-}"
      COPYPASTE_PERSISTENCE_BACKEND: "${COPYPASTE_PERSISTENCE_BACKEND:-memory}"
      UPSTASH_REDIS_REST_URL: "${UPSTASH_REDIS_REST_URL:-}"
      UPSTASH_REDIS_REST_TOKEN: "${UPSTASH_REDIS_REST_TOKEN:-}"
      COPYPASTE_ALLOWED_ORIGINS: "${COPYPASTE_ALLOWED_ORIGINS:-https://copypaste.fyi,https://www.copypaste.fyi,http://127.0.0.1:5173,http://localhost:5173}"
      COPYPASTE_RATE_LIMIT_CREATES: "${COPYPASTE_RATE_LIMIT_CREATES:-10}"
      COPYPASTE_RATE_LIMIT_READS: "${COPYPASTE_RATE_LIMIT_READS:-120}"
      COPYPASTE_MAX_PASTE_SIZE: "${COPYPASTE_MAX_PASTE_SIZE:-1048576}"
      # Local development remains open unless an operator opts into API-key auth.
      COPYPASTE_REQUIRE_WRITE_AUTH: "${COPYPASTE_REQUIRE_WRITE_AUTH:-false}"
      COPYPASTE_ALLOW_SESSION_WRITES: "${COPYPASTE_ALLOW_SESSION_WRITES:-false}"
      COPYPASTE_ALLOW_WEBHOOKS: "false"
      COPYPASTE_ALLOW_ATTESTATIONS: "false"
      COPYPASTE_ALLOW_UPLOADED_STEGO: "false"
      COPYPASTE_ALLOW_STEGO: "false"
      COPYPASTE_REQUIRE_CRYPTO_VERIFICATION: "${COPYPASTE_REQUIRE_CRYPTO_VERIFICATION:-true}"
      ROCKET_LOG_LEVEL: "${ROCKET_LOG_LEVEL:-normal}"
      CRYPTO_VERIFIER_URL: "http://crypto-verifier.internal:8001"
      COPYPASTE_ONION_HOST: "${COPYPASTE_ONION_HOST:-}"
      COPYPASTE_ONION_INGRESS_TOKEN: "${COPYPASTE_ONION_INGRESS_TOKEN:-}"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    depends_on:
      crypto-verifier:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/copypaste", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - copypaste-net
      - verifier-net

  crypto-verifier:
    build:
      context: ./ocaml-crypto-verifier
      dockerfile: Dockerfile
    expose:
      - "8001"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      verifier-net:
        aliases:
          - crypto-verifier.internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

networks:
  copypaste-net:
    driver: bridge
  verifier-net:
    driver: bridge
    internal: true

volumes:
  data:
