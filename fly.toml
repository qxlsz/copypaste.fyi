# fly.toml app configuration file generated for copypaste-fyi-withered-darkness-575 on 2025-11-02T21:10:19-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'copypaste-fyi-withered-darkness-575'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.backend'

[env]
  ROCKET_ADDRESS = '0.0.0.0'
  ROCKET_PORT = '8000'
  RUST_LOG = 'info'
  COPYPASTE_TRUSTED_IP_HEADER = 'Fly-Client-IP'
  COPYPASTE_ALLOWED_ORIGINS = 'https://copypaste.fyi,https://www.copypaste.fyi'
  COPYPASTE_RATE_LIMIT_CREATES = '10'
  COPYPASTE_RATE_LIMIT_READS = '120'
  COPYPASTE_MAX_PASTE_SIZE = '1048576'
  # Public pastebin: Get link must work without an operator token.
  # Self-hosters close writes with COPYPASTE_REQUIRE_WRITE_AUTH=true.
  COPYPASTE_REQUIRE_WRITE_AUTH = 'false'
  COPYPASTE_ALLOW_SESSION_WRITES = 'false'
  COPYPASTE_ALLOW_WEBHOOKS = 'false'
  COPYPASTE_ALLOW_ATTESTATIONS = 'false'
  COPYPASTE_ALLOW_UPLOADED_STEGO = 'false'
  COPYPASTE_ALLOW_STEGO = 'false'
  # Upstash GET/SET currently 503s ("Paste storage is temporarily unavailable").
  # Use process memory until Redis is healthy; keep one machine running so
  # share links survive idle. FORCE_MEMORY beats a leftover redis Fly secret.
  COPYPASTE_PERSISTENCE_BACKEND = 'memory'
  COPYPASTE_FORCE_MEMORY = 'true'
  COPYPASTE_REQUIRE_CRYPTO_VERIFICATION = 'true'
  # crypto-verifier runs in its own process group (separate VM) — reach it via
  # Fly's per-process-group private DNS, not localhost.
  CRYPTO_VERIFIER_URL = 'http://crypto-verifier.process.copypaste-fyi-withered-darkness-575.internal:8001'

[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"
    protocol = "http"
    restart_limit = 3

  [services.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

# crypto-verifier is internal-only: its separate process-group VM is reachable
# over Fly's private network and has no public [[services]] listener.

[processes]
  app = 'copypaste serve'
  crypto-verifier = 'crypto-verifier'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  processes = ["app"]

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  processes = ["crypto-verifier"]
